name: Daily Portfolio Update

on:
  schedule:
    # Live snapshots, Monday to Friday, every 30 minutes from 9:30 AM to 3:30 PM IST
    #   04:00-09:30 UTC (every 30 min) = 9:30 AM-3:00 PM IST ...
    - cron: "0,30 4-9 * * 1-5"
    #   ... plus 10:00 UTC = 3:30 PM IST
    - cron: "0 10 * * 1-5"
    # Final end-of-day snapshot: 12:15 UTC = 5:45 PM IST (this one also triggers the Make.com report)
    - cron: "15 12 * * 1-5"
  workflow_dispatch:   # lets you press "Run workflow" manually to test
    inputs:
      final:
        description: "Set to true for the end-of-day run that also sends the report to Make.com (used by the 5:25 PM Claude task)"
        required: false
        default: "false"

permissions:
  contents: write      # needed so the bot can save updated files to your repo

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run the tracker
        id: run
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          RUN_MODE: ${{ github.event_name == 'schedule' && github.event.schedule != '15 12 * * 1-5' && 'intraday' || 'final' }}
        run: python tracker.py

      - name: Save results to the repo
        if: steps.run.outputs.updated == 'true'
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Portfolio update $(TZ=Asia/Kolkata date '+%F %H:%M') IST"
          git pull --rebase -X theirs origin main
          git push

      # The AI report, PDF and Telegram message must happen EXACTLY ONCE a day.
      # Two things can trigger it: the 5:25 PM Claude task (manual dispatch with final=true) and the
      # 5:45 PM GitHub cron as a backup. Whichever runs first sends to Make.com and writes
      # data/make_sent.txt with today's date; the other one sees that file and skips the Make.com call.
      # Manual runs without final=true and the 30-minute live runs never send.
      - name: Send data to Make.com (once a day)
        if: ${{ always() && steps.run.outputs.updated == 'true' && ((github.event_name == 'schedule' && github.event.schedule == '15 12 * * 1-5') || (github.event_name == 'workflow_dispatch' && github.event.inputs.final == 'true')) }}
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          git pull --rebase -X theirs origin main
          if [ -f data/make_sent.txt ] && [ "$(cat data/make_sent.txt)" = "$TODAY" ]; then
            echo "Make.com report already sent for $TODAY - skipping duplicate."
            exit 0
          fi
          if [ -z "$MAKE_WEBHOOK_URL" ]; then
            echo "MAKE_WEBHOOK_URL secret not set - skipping Make.com step."
            exit 0
          fi
          curl -sS --fail -X POST -H "Content-Type: application/json" --data @data/latest.json "$MAKE_WEBHOOK_URL"
          echo "$TODAY" > data/make_sent.txt
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add data/make_sent.txt
          git commit -m "Make.com report sent $TODAY"
          git pull --rebase -X theirs origin main
          git push
