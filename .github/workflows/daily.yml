name: Daily Portfolio Update

on:
  schedule:
    # Live snapshots, Monday to Friday, every 30 minutes from 9:30 AM to 3:30 PM IST
    #   04:00-09:30 UTC (every 30 min) = 9:30 AM-3:00 PM IST ...
    - cron: "0,30 4-9 * * 1-5"
    #   ... plus 10:00 UTC = 3:30 PM IST
    - cron: "0 10 * * 1-5"
    # Final end-of-day snapshot: 11:30 UTC = 5:00 PM IST (this one also triggers the Make.com report)
    - cron: "30 11 * * 1-5"
  workflow_dispatch:   # lets you press "Run workflow" manually to test

permissions:
  contents: write      # needed so the bot can save updated files to your repo

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run the tracker
        id: run
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          RUN_MODE: ${{ github.event_name == 'schedule' && github.event.schedule != '30 11 * * 1-5' && 'intraday' || 'final' }}
        run: python tracker.py

      - name: Save results to the repo
        if: steps.run.outputs.updated == 'true'
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Portfolio update $(TZ=Asia/Kolkata date '+%F %H:%M') IST"
          git pull --rebase -X theirs origin main
          git push

      # Only the 5 PM final run (and manual runs) send data to Make.com, so the AI report,
      # PDF and Telegram message happen once a day and Make's free quota is not used up.
      - name: Send data to Make.com
        if: ${{ always() && steps.run.outputs.updated == 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 11 * * 1-5') }}
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          if [ -n "$MAKE_WEBHOOK_URL" ]; then
            curl -sS -X POST -H "Content-Type: application/json" --data @data/latest.json "$MAKE_WEBHOOK_URL"
          else
            echo "MAKE_WEBHOOK_URL secret not set - skipping Make.com step."
          fi
